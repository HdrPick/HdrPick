<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jietu-hdr</title>
    <style>
      html, body, #app {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #1c1c20;
      }

      /* ===== 启动动画（静态层：Vue 挂载前即可见，主窗口就绪后由 App.vue 淡出移除） ===== */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 13px;
        background:
          radial-gradient(58% 46% at 50% 40%, rgba(200, 162, 200, 0.09), transparent 72%),
          #1c1c20;
        transition: opacity 380ms ease;
        user-select: none;
      }
      #app-splash.splash-out {
        opacity: 0;
        pointer-events: none;
      }
      .sp-mark {
        animation: sp-breathe 2.2s ease-in-out infinite;
      }
      @keyframes sp-breathe {
        0%, 100% { transform: scale(1); opacity: 0.88; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      .sp-name {
        font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.6px;
        color: #ecebf0;
      }
      .sp-tip {
        font-size: 11px;
        color: #8a8794;
        letter-spacing: 2px;
      }
      .sp-dots {
        display: flex;
        gap: 6px;
        margin-top: 2px;
      }
      .sp-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #c8a2c8;
        animation: sp-wave 1.1s ease-in-out infinite;
      }
      .sp-dots span:nth-child(2) { animation-delay: 0.15s; }
      .sp-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes sp-wave {
        0%, 100% { opacity: 0.25; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-4px); }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <!-- 启动动画：主窗口专属（看图/贴图/区域选择 hash 路由窗口不显示） -->
    <div id="app-splash" aria-hidden="true">
      <svg class="sp-mark" width="46" height="46" viewBox="0 0 1024 1024" fill="none">
        <defs>
          <linearGradient id="sp-sun" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#1d2c52"/>
            <stop offset="0.45" stop-color="#7a6bb0"/>
            <stop offset="0.78" stop-color="#f0c987"/>
            <stop offset="1" stop-color="#fff8e8"/>
          </linearGradient>
          <linearGradient id="sp-frame" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e6c8e6"/>
            <stop offset="1" stop-color="#9d7ba3"/>
          </linearGradient>
        </defs>
        <!-- 取景框四角（应用图标同款造型） -->
        <g stroke="url(#sp-frame)" stroke-width="46" stroke-linecap="round" fill="none">
          <path d="M 262 372 L 262 262 L 372 262"/>
          <path d="M 652 262 L 762 262 L 762 372"/>
          <path d="M 762 652 L 762 762 L 652 762"/>
          <path d="M 372 762 L 262 762 L 262 652"/>
        </g>
        <!-- HDR 渐变太阳：暗部深蓝 → 峰值亮金 -->
        <circle cx="512" cy="460" r="168" fill="url(#sp-sun)"/>
        <rect x="344" y="472" width="336" height="6" rx="3" fill="#fff3d6" opacity="0.85"/>
      </svg>
      <div class="sp-name">jietu-hdr</div>
      <div class="sp-dots"><span></span><span></span><span></span></div>
      <div class="sp-tip">正在启动</div>
    </div>
    <script>
      // 非主窗口（#/viewer、#/pin、#/region-select）不显示启动动画；
      // 记录首帧时间供 App.vue 计算“最低展示时长”，避免一闪而过
      window.__SPLASH_T0 = performance.now();
      (function () {
        var h = window.location.hash || "";
        if (h !== "" && h !== "#" && h !== "#/") {
          var s = document.getElementById("app-splash");
          if (s) s.parentNode.removeChild(s);
          window.__SPLASH_T0 = 0;
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
